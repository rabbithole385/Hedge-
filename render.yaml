# Nexora on Render - FREE plan Blueprint
# Render dashboard -> New -> Blueprint -> pick this repo -> Apply.
# You'll be asked for your database details (e.g. your cPanel MySQL with Remote MySQL enabled,
# or a free cloud MySQL such as TiDB Cloud Serverless or Aiven - set DB_SSL=1 for those).
# Free plan notes: the server sleeps after 15 min without visitors (first visit then takes ~1 min),
# and uploads are kept safe in the database because free services have no disk.
services:
  - type: web
    name: hedgeinv
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz.php
    autoDeployTrigger: commit
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      # 1 for cloud MySQL that requires an encrypted connection (TiDB Cloud, Aiven). 0 for cPanel MySQL.
      - key: DB_SSL
        value: "0"
      # Only used if the database is brand new: admin login is admin / this value.
      - key: ADMIN_INITIAL_PASSWORD
        generateValue: true
      - key: TICK_SECONDS
        value: "120"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
