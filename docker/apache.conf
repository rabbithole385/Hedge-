# Render terminates HTTPS and forwards to ${PORT}. Tell PHP the original request was HTTPS
# and log the real visitor IP.
Listen ${PORT}
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html
    RemoteIPHeader X-Forwarded-For
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    # Never serve raw config, SQL or log files.
    <FilesMatch "\.(sql|log|md|sh|ini)$|^error_log$">
        Require all denied
    </FilesMatch>
    <DirectoryMatch "^/var/www/html/(config|database|includes)">
        <FilesMatch "\.(php)$">
            Require all denied
        </FilesMatch>
    </DirectoryMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
