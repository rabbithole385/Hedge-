# Railway/Render terminate HTTPS and forwards to ${PORT}. Tell PHP the original request was HTTPS
# and log the real visitor IP.
Listen ${PORT}
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html
    RemoteIPHeader X-Forwarded-For
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    # Never serve raw config, SQL or log files.
    <FilesMatch "\.(sql|log|md|sh|ini)$|^error_log$">
        Require all denied
    </FilesMatch>
    <DirectoryMatch "^/var/www/html/(config|database|includes)">
        <FilesMatch "\.(php)$">
            Require all denied
        </FilesMatch>
    </DirectoryMatch>
    # Client documents are only ever served through the admin pages (admin/kyc_file.php, admin/deposit_proof_file.php).
    <LocationMatch "^/assets/uploads/(kyc|deposit_proofs)/">
        Require all denied
    </LocationMatch>
    # The platform (Railway/Render) handles HTTPS and talks to Apache on ${PORT}. Tell Apache the public
    # side is https on port 443, so its own redirects (/ -> /en/, /en -> /en/, old pages) go to
    # https://yourdomain/... and never to http://yourdomain:${PORT}/... The hostname still comes from the visitor.
    ServerName https://localhost:443
    UseCanonicalName Off
    # Pages, styles and scripts: browsers re-check on every visit, so updates show straight away.
    <FilesMatch "\.(html|css|js)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
